[project]
name = "cleanfreak-node-2-0"
description = "One-click tidy-by-role for any ComfyUI workflow — loaders, encoders, samplers, decoders, and outputs each sorted into their own column with coloured group cards and connections preserved. 1200+ node classes pre-classified out of the box, and the classifier learns the ones you edit. Works in both classic canvas and Nodes 2.0."
version = "1.1.0"
license = "MIT"
authors = [
    { name = "Peter Neill" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/edisonchan/comfyui-CleanFreak-Node-2.0"
Repository = "https://github.com/edisonchan/comfyui-CleanFreak-Node-2.0"
Issues = "https://github.com/edisonchan/comfyui-CleanFreak-Node-2.0/issues"

[tool.comfy]
PublisherId = "edison"
DisplayName = "CleanFreak (Nodes 2.0)"
Icon = ""
